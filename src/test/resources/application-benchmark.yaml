jchatmind:
  agent:
    observability:
      recovery-enabled: false
  code-rag:
    embedding-warmup:
      enabled: false
    answer-evidence:
      raw-top-k: 20
      final-top-k: 5
      include-selector-debug: true
  context-compression:
    enabled: true
    keep-recent-rounds: 8
    max-history-messages: 20
    max-summary-chars: 1200
    compression-trigger-tokens: 200000
    working-context-hard-limit-tokens: 256000
    max-single-tool-result-tokens: 8000
    chars-per-token: 3
    model-thresholds:
      default:
        compression-trigger-tokens: 200000
        working-context-hard-limit-tokens: 256000
        max-single-tool-result-tokens: 8000
      gpt-5.5:
        compression-trigger-tokens: 200000
        working-context-hard-limit-tokens: 256000
        max-single-tool-result-tokens: 8000
