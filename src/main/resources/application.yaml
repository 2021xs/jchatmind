spring:
  application:
    name: jchatmind
  config:
    import: optional:file:./application-local.yaml
  autoconfigure:
    exclude:
      - org.springframework.ai.model.deepseek.autoconfigure.DeepSeekChatAutoConfiguration
  datasource:
    url: ${POSTGRES_URL:jdbc:postgresql://localhost:5432/jchatmind}
    username: ${POSTGRES_USER:your-db-user}
    password: ${POSTGRES_PASSWORD:your-db-password}
    driver-class-name: org.postgresql.Driver
  ai:
    zhipuai:
      api-key: your-api-key
      base-url: https://open.bigmodel.cn/api/paas
      chat:
        options:
          model: glm-4.6
mybatis:
  type-aliases-package: com.kama.jchatmind.model.entity
  mapper-locations: classpath:mapper/*.xml
  type-handlers-package: com.kama.jchatmind.typehandler

document:
  storage:
    base-path: ./data/documents

logging:
  level:
    org.springframework.web: INFO
    org.springframework.web.client.RestTemplate: INFO
    org.springframework.web.HttpLogging: INFO
    org.springframework.http.codec: INFO
    org.springframework.web.servlet.mvc.method.annotation: INFO

jchatmind:
  async:
    task:
      core-pool-size: ${JCHATMIND_ASYNC_TASK_CORE_POOL_SIZE:4}
      max-pool-size: ${JCHATMIND_ASYNC_TASK_MAX_POOL_SIZE:8}
      queue-capacity: ${JCHATMIND_ASYNC_TASK_QUEUE_CAPACITY:16}
      keep-alive-seconds: ${JCHATMIND_ASYNC_TASK_KEEP_ALIVE_SECONDS:60}
      await-termination-seconds: ${JCHATMIND_ASYNC_TASK_AWAIT_TERMINATION_SECONDS:60}
    code-evidence-selector:
      core-pool-size: ${JCHATMIND_SELECTOR_CORE_POOL_SIZE:4}
      max-pool-size: ${JCHATMIND_SELECTOR_MAX_POOL_SIZE:4}
      queue-capacity: ${JCHATMIND_SELECTOR_QUEUE_CAPACITY:6}
      keep-alive-seconds: ${JCHATMIND_SELECTOR_KEEP_ALIVE_SECONDS:60}
      await-termination-seconds: ${JCHATMIND_SELECTOR_AWAIT_TERMINATION_SECONDS:60}
    tool:
      core-pool-size: ${JCHATMIND_TOOL_CORE_POOL_SIZE:4}
      max-pool-size: ${JCHATMIND_TOOL_MAX_POOL_SIZE:8}
      queue-capacity: ${JCHATMIND_TOOL_QUEUE_CAPACITY:16}
      keep-alive-seconds: ${JCHATMIND_TOOL_KEEP_ALIVE_SECONDS:60}
      await-termination-seconds: ${JCHATMIND_TOOL_AWAIT_TERMINATION_SECONDS:30}
  feishu:
    enabled: ${JCHATMIND_FEISHU_ENABLED:false}
    app-id: ${JCHATMIND_FEISHU_APP_ID:}
    app-secret: ${JCHATMIND_FEISHU_APP_SECRET:}
    verification-token: ${JCHATMIND_FEISHU_VERIFICATION_TOKEN:}
    encrypt-key: ${JCHATMIND_FEISHU_ENCRYPT_KEY:}
    default-agent-id: ${JCHATMIND_FEISHU_DEFAULT_AGENT_ID:}
    repo-aliases:
      hmdp: ${JCHATMIND_FEISHU_REPO_ALIAS_HMDP:}
      黑马点评: ${JCHATMIND_FEISHU_REPO_ALIAS_HEIMA_DIANPING:}
  database-tool:
    datasource:
      url: ${JCHATMIND_DB_READONLY_URL:jdbc:postgresql://localhost:5432/jchatmind}
      username: ${JCHATMIND_DB_READONLY_USERNAME:jchatmind_readonly}
      password: ${JCHATMIND_DB_READONLY_PASSWORD:}
      driver-class-name: org.postgresql.Driver
  ai:
    deepseek:
      official:
        api-key: ${DEEPSEEK_OFFICIAL_API_KEY:your-api-key}
        base-url: ${DEEPSEEK_OFFICIAL_BASE_URL:https://api.deepseek.com}
        model: ${DEEPSEEK_OFFICIAL_MODEL:deepseek-chat}
    gpt:
      compatible:
        api-key: ${GPT_COMPATIBLE_API_KEY:your-api-key}
        base-url: ${GPT_COMPATIBLE_BASE_URL:https://api.openai.com/v1}
        model: ${GPT_COMPATIBLE_MODEL:gpt-5.5}
  code-rag:
    # Final answer-time Code RAG path:
    # RAW_VECTOR candidates + LLM evidence selector.
    allowed-roots:
      - D:/Project
      - D:/workspace
    max-file-size-bytes: 1048576
    max-files-per-import: 2000
    embedding-base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
    embedding-model: ${OLLAMA_EMBEDDING_MODEL:bge-m3}
    embedding-batch-size: ${CODE_RAG_EMBEDDING_BATCH_SIZE:16}
    include-sql-files: ${CODE_RAG_INCLUDE_SQL_FILES:false}
    embedding-warmup:
      enabled: true
      prompt: warmup code rag embedding
    embedding-cache:
      enabled: true
      max-size: 512
      ttl-minutes: 30
    embedding-metadata:
      enabled: true
    llm-selector:
      # Tests may disable this to verify fallback; normal Agent flow keeps selector on.
      enabled: true
      model: gpt-5.5
      max-candidate-chars: 600
      max-selected: 5
      timeout-ms: 30000
    answer-evidence:
      # Agent tool answer-time evidence path. REST /search keeps the raw candidate endpoint.
      raw-top-k: 20
      final-top-k: 5
      include-selector-debug: true
  agent:
    tool-timeout:
      default-timeout: ${JCHATMIND_AGENT_TOOL_TIMEOUT:60s}
      overrides: {}
    tool-result:
      default-max-result-chars: ${JCHATMIND_AGENT_TOOL_MAX_RESULT_CHARS:8000}
      overrides: {}
    duplicate-detection:
      enabled: ${JCHATMIND_AGENT_DUPLICATE_DETECTION_ENABLED:true}
      max-consecutive-same-calls: ${JCHATMIND_AGENT_MAX_CONSECUTIVE_SAME_CALLS:2}
    database-tool:
      max-rows: ${AGENT_DB_TOOL_MAX_ROWS:50}
      query-timeout-seconds: ${AGENT_DB_TOOL_QUERY_TIMEOUT_SECONDS:5}
      fetch-size: ${AGENT_DB_TOOL_FETCH_SIZE:50}
      max-cell-chars: ${AGENT_DB_TOOL_MAX_CELL_CHARS:500}
      max-result-length: ${AGENT_DB_TOOL_MAX_RESULT_LENGTH:4000}
    observability:
      stale-running-threshold-minutes: 10
      recovery-enabled: true
    tool-correction:
      enabled: true
      max-attempts: 3
  token-counter:
    enabled: ${JCHATMIND_TOKEN_COUNTER_ENABLED:false}
    base-url: ${JCHATMIND_TOKEN_COUNTER_BASE_URL:}
    timeout: ${JCHATMIND_TOKEN_COUNTER_TIMEOUT:2s}
    fallback-to-estimated: true
  context-compression:
    enabled: true
    keep-recent-rounds: 8
    max-history-messages: 20
    max-summary-chars: 1200
    max-context-tokens: 30000
    max-single-tool-result-tokens: 5000
    chars-per-token: 3
    model-thresholds:
      default:
        max-context-tokens: 30000
        max-single-tool-result-tokens: 5000
      gpt-5.5:
        max-context-tokens: 80000
        max-single-tool-result-tokens: 8000
      dsv4:
        max-context-tokens: 30000
        max-single-tool-result-tokens: 5000
